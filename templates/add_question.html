<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Add Questions</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background: url('{{ url_for("static", filename="images/ad.jpg") }}') no-repeat center center fixed;
      background-size: cover; color: #fff; font-family: 'Segoe UI', sans-serif;
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
    }
    body::before {
      content: ""; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(15, 15, 20, 0.85); backdrop-filter: blur(8px); z-index: -1;
    }
    .glass-card {
      background: rgba(30, 30, 40, 0.7); border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 20px; padding: 30px; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      width: 100%; max-width: 600px;
    }
    .modern-input {
      background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1);
      color: white; border-radius: 10px; padding: 12px; width: 100%; margin-bottom: 12px;
    }
    .modern-input:focus { border-color: #ff0844; outline: none; }
    .btn-gradient { background: linear-gradient(to right, #ff0844, #ffb199); color: white; border: none; font-weight: bold; border-radius: 10px; padding: 12px; }
    /* Fix for dropdown text turning black */
    select option { background: #1a1a24; color: white; }
  </style>
</head>
<body>

<div style="position: absolute; top: 20px; left: 20px;">
    <a href="/dashboard" class="btn btn-outline-light rounded-pill px-4">← Finish & Return to Dashboard</a>
</div>

<div class="glass-card">
  <h3 class="mb-4 text-center fw-bold">Add Question to Exam</h3>
  <form method="POST">
    <input type="text" name="question" class="modern-input" placeholder="Enter Question text..." required>
    
    <div class="row">
        <div class="col-md-6"><input type="text" name="a" class="modern-input" placeholder="Option A" required></div>
        <div class="col-md-6"><input type="text" name="b" class="modern-input" placeholder="Option B" required></div>
        <div class="col-md-6"><input type="text" name="c" class="modern-input" placeholder="Option C" required></div>
        <div class="col-md-6"><input type="text" name="d" class="modern-input" placeholder="Option D" required></div>
    </div>
    
    <label class="text-muted mt-2 mb-1">Select the Correct Answer:</label>
    <select name="correct" class="modern-input mb-4" required>
        <option value="" disabled selected>Choose correct option...</option>
        <option value="a">Option A</option>
        <option value="b">Option B</option>
        <option value="c">Option C</option>
        <option value="d">Option D</option>
    </select>
    
    <button type="submit" class="btn btn-gradient w-100">Save Question & Add Another ➕</button>
  </form>
</div>

</body>
</html>
